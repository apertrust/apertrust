[package]
name = "apertrust-engine"
description = "Apertrust processing engine: GPU-resident pipeline, no UI dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
# Its settings part, for the store the binaries hand the engine's settings and the types
# of its generated statics, and its jobs, darktable's control, which the session runs
# (decision 57), and its cache, whose `UnusedAfter` a setting of its takes and whose
# `Limit` its settings give (decision 76): never its folders, so the engine finds no
# settings file itself (decision 43).
apertrust-base = { workspace = true, features = ["jobs", "cache"] }
apertrust-color.workspace = true
# What an export writes and where, which its session's export jobs use (decision 56).
apertrust-export.workspace = true
apertrust-plugin.workspace = true
apertrust-raw.workspace = true
apertrust-tools.workspace = true
# The .apxmp file's text layer, `apertrust_library::sidecar`; the engine reads and writes
# its values with the tools (decision 54).
apertrust-library.workspace = true
# The export's start, for darktable's variables (`names`).
chrono.workspace = true
# A history step's random id (decision 78).
getrandom.workspace = true
pollster.workspace = true
# The session's commands and events, in decision 59's JSON shape (decision 108).
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[features]
# A session whose raws are the tools crate's synthetic photo (`session::testing`), for the
# tests of the engine's clients: the app's, through its dev-dependencies.
testing = ["apertrust-tools/testing"]

[build-dependencies]
# The settings generator, which writes the engine's statics from the schema (decision 43).
apertrust-base = { workspace = true, features = ["codegen"] }

[dev-dependencies]
naga.workspace = true
# Its `testing::Sample` tool, for the session's and the edit's tests.
apertrust-operations.workspace = true
apertrust-tools = { workspace = true, features = ["testing"] }
# Its `testing` hooks, a raw marked as not on the disk and the raws' reads counted, for the
# thumbnail tests.
apertrust-library = { workspace = true, features = ["testing"] }
# The session protocol's round-trip test (`session/tests/protocol.rs`).
serde_json.workspace = true

[lints]
workspace = true
