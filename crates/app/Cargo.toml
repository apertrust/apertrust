[package]
name = "apertrust"
description = "Apertrust desktop editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The single-instance channel's name, the user data folder's hash (decision 89).
blake3.workspace = true
bytemuck.workspace = true
directories.workspace = true
eframe.workspace = true
egui-winit.workspace = true
egui_commonmark.workspace = true
apertrust-base = { workspace = true, features = ["cache", "folders", "log"] }
apertrust-display.workspace = true
apertrust-engine.workspace = true
# The Export dialog's settings, its choices, the variables it lists and the size it computes.
apertrust-export.workspace = true
apertrust-operations.workspace = true
# The image context a tool's view of the pending values takes.
apertrust-plugin.workspace = true
apertrust-tools.workspace = true
apertrust-ui.workspace = true
rfd.workspace = true
# The settings' values as settings.toml keeps them, which the Settings dialog's rows show
# and change without their types.
toml.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[build-dependencies]
# The settings generator: the app's settings, generated from the schema (decision 43);
# and the version and the banner's versions, read in the app's own build (decision 44).
apertrust-base = { workspace = true, features = ["codegen", "build"] }

# The executable's icon and version resource, compiled on Windows by the SDK's rc.exe
# (build.rs; docs/packaging.md). A host dependency: Windows builds are built on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
# A real session on synthetic raws (`session::testing`), whose events the mirror's tests take in.
apertrust-engine = { workspace = true, features = ["testing"] }
# The jobs' control, which gives the jobs mirror's tests real job numbers.
apertrust-base = { workspace = true, features = ["jobs"] }
# Its `testing::Sample` tool, whose rows the renderer's tests draw too.
apertrust-tools = { workspace = true, features = ["testing"] }
# A history step's time on the local clock, so its tooltip reads the same in every zone.
chrono.workspace = true
egui_kittest.workspace = true
naga.workspace = true
# The app icon's platform files, rendered from its SVGs by `examples/icons.rs`
# (tools/build-icons.sh), and the disk image's background by `examples/dmg_background.rs`
# (tools/build-dmg-background.sh).
png.workspace = true
pollster.workspace = true
resvg.workspace = true

# The pointer spike's platform calls (`examples/pointer_spike.rs`, issue 555), on its branch
# alone; versions already in Cargo.lock.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13.2", features = ["resource_manager"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSCursor", "NSGraphics", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
