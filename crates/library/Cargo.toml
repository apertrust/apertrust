[package]
name = "apertrust-library"
description = "Apertrust's library: folders, their photos and sidecars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `testing`, a test's hooks for the tests of the library's clients: a raw marked as not on
# the disk and the raws' reads counted (the engine's, through its dev-dependencies).
testing = []

[dependencies]
# The decoder's extensions, which say what a raw is, and a raw's embedded picture for its
# thumbnail; no GPU or engine (decision 54).
apertrust-raw.workspace = true
# Its `fs` part: removes the temporaries of writes that never ended from a folder it lists
# (decision 53); and its `variables`, darktable's variables and `Places`, which Import's
# folder patterns expand (decision 85).
apertrust-base = { workspace = true, features = ["fs", "variables"] }
# The hash of a sidecar's bytes and of the machine id, and later the photo's fingerprint
# (decisions 47 and 53).
blake3.workspace = true
# A clock's time as an XMP Date (decision 47).
chrono.workspace = true
# The system's machine id, which the machine id hashes with the user (decision 47).
machine-uid.workspace = true
# The machine id drawn at random where the system's cannot be read.
getrandom.workspace = true
# The sidecar's XML (decision 54, layer 1).
quick-xml.workspace = true
# The commands, events and errors the session protocol carries (decision 108).
serde.workspace = true
# The volumes mounted, their names, mount points, removable flags and free space, for
# Import's Source and preview (decision 85).
sysinfo.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
