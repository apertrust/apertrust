[package]
name = "apertrust-display"
description = "Apertrust display colour, title bar and dialogs: tags the window surface's colour space where wgpu does not, places the window's buttons in the app's top bar, presents dialogs as sheets and shows popup menus from the run loop, receives the files Finder opens with the app, and attaches the Windows app to the terminal it was started from"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle = { version = "0.6.2", features = ["std"] }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The blocks a sheet's calls are scheduled on the run loop with; objc2-app-kit's already.
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSFont", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "NSAccessibility", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSDate", "NSDictionary", "NSEnumerator", "NSGeometry", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
# The console calls that attach the windowed app to the terminal it was started from
# (`console.rs`); the version eframe and rfd already bring.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
