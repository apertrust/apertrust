# Apertrust's grey theme, after darktable's darktable-elegant-grey: a middle-grey surround,
# L* 50, panels a step darker with soft light text (docs/gui.md, decision 36).
# Every token is named by its role; crates/ui/src/theme.rs says what each one is for.
# Colours are sRGB, #RRGGBB or #RRGGBBAA. Sizes are points, before scaling.

name = "grey"
dark = true

