# Apertrust's high-contrast theme: text at 7:1 or more, WCAG AAA (docs/gui.md, decision 36).
# Every token is named by its role; crates/ui/src/theme.rs says what each one is for.
# Colours are sRGB, #RRGGBB or #RRGGBBAA. Sizes are points, before scaling.

name = "high-contrast"
dark = true

[colors]
surface = "#000000"
panel = "#000000"
raised = "#0A0A0A"
scrim = "#000000B3"
sunken = "#000000"
photo_surround = "#000000"
surround_text = "#FFFFFF"
surround_text_on_light = "#000000"
text = "#FFFFFF"
text_strong = "#FFFFFF"
text_secondary = "#D9D9D9"
text_disabled = "#8C8C8C"
text_on_accent = "#000000"
border = "#FFFFFF"
control_outline = "#FFFFFF"
divider = "#8C8C8C"
separator = "#8C8C8C"
accent = "#FFBF00"
accent_text = "#FFBF00"
accent_subtle = "#3D2E00"
focus_ring = "#FFBF00"
selection = "#5C4500"
field_selection = "#595959"
hover = "#1F1F1F"
list_chosen = "#333333"
close_hover = "#C42B1C"
text_on_close_hover = "#FFFFFF"
slider_track = "#8C8C8C"
slider_fill = "#FFFFFF"
slider_handle = "#FFD400"
