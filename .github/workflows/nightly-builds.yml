name: Nightly builds

# Apertrust Nightly's packages, built each night from main, each on its own platform, and
# published as the `nightly` pre-release, made again on the commit built
# (docs/packaging.md, Nightly builds). Nothing is built when main has not changed since
# the last nightly, unless a run by hand forces it; nothing is published when any build
# fails, or from a branch other than main.
on:
  schedule:
    - cron: "0 0 * * *"   # midnight UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even when main has not changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

# One nightly at a time: a second waits for the first.
concurrency:
  group: nightly-builds
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER: 0.11.8
  CARGO_GENERATE_RPM: 0.21.1
  # Downloaded, each checked against the SHA-256 its job gives: rustup where the Windows
  # Arm runner has none and in the Linux jobs' container, and appimagetool with its
  # runtime, which give the AppImages their update information.
  RUSTUP: 1.29.3
  APPIMAGETOOL: 1.9.1
  APPIMAGE_RUNTIME: "20251108"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changed.outputs.build }}
      sha: ${{ github.sha }}
    steps:
      - name: Compare with the last nightly
        id: changed
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          last=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/tags/nightly | cut -f1)
          echo "last nightly: ${last:-none}, this commit: $GITHUB_SHA"
          if [ "$FORCE" = true ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "build=true" >>"$GITHUB_OUTPUT"
          else
            echo "main has not changed since the last nightly: nothing to build"
            echo "build=false" >>"$GITHUB_OUTPUT"
          fi

  # Both chips' disk images, Apple silicon native and Intel cross-built.
  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          # The version counts every commit since the last release tag (decision 44).
          fetch-depth: 0
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: cargo --version
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo install --locked cargo-packager --version "$CARGO_PACKAGER"
      - run: tools/package.sh --nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: target/package/*/out/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # The scripts as committed, with LF line ends, which Git Bash needs: the runner's git
      # would check them out with CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: cargo --version
      - run: cargo install --locked cargo-packager --version "$CARGO_PACKAGER"
      - run: tools/package.sh --nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: |
            target/package/*/out/*-setup.exe
            target/package/*/out/*.zip
          if-no-files-found: error
          retention-days: 7

  # Windows on Arm's installer and zip, built on Arm.
  windows-arm:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The image comes with rustup; should it not, rustup itself, pinned and checked, which
      # then installs the toolchain rust-toolchain.toml pins on first use.
      - name: Install rustup if missing
        env:
          RUSTUP_INIT_SHA256: 407e0d72f81d26a01f9d032b8317908cbb2917ba22765474b682b41390792ad9
        run: |
          if command -v rustup >/dev/null; then
            rustup --version
            exit 0
          fi
          init=$(cygpath -u "$RUNNER_TEMP")/rustup-init.exe
          curl -fsSL -o "$init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP/aarch64-pc-windows-msvc/rustup-init.exe"
          echo "$RUSTUP_INIT_SHA256  $init" | sha256sum -c -
          "$init" -y --no-modify-path --profile minimal --default-toolchain none
          printf '%s\\bin\n' "${CARGO_HOME:-$USERPROFILE\\.cargo}" >>"$GITHUB_PATH"
      - run: cargo --version
      # The target named, so the packages are Arm's whichever host rustup runs as.
      - run: rustup target add aarch64-pc-windows-msvc
      - run: cargo install --locked cargo-packager --version "$CARGO_PACKAGER"
      - run: tools/package.sh --nightly --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows-arm
          path: |
            target/package/*/out/*-setup.exe
            target/package/*/out/*.zip
          if-no-files-found: error
          retention-days: 7

  # The x86_64 AppImage, .deb, .rpm and tarball, built in Ubuntu 22.04's container, not on
  # the runner's 24.04: the binaries then need glibc 2.35 at most, so one package of each
  # installs on most distributions (docs/packaging.md, Nightly builds).
  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde
    timeout-minutes: 120
    # Named: the steps use bash's arrays, and an explicit bash also sets pipefail.
    defaults:
      run:
        shell: bash
    env:
      # linuxdeploy, its AppImage plugin and appimagetool are AppImages, and the container
      # has no FUSE: each extracts itself and runs.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      # The tools before the checkout, which needs git for a full clone: the compiler and
      # linker (build-essential, with objdump, which reads the glibc the .deb needs), file
      # and zsync for the AppImage, and rustup, pinned and checked, which installs the
      # toolchain rust-toolchain.toml pins on first use. The same step in linux-arm, with
      # Arm's rustup.
      - name: Install the build's tools
        env:
          RUSTUP_TARGET: x86_64-unknown-linux-gnu
          RUSTUP_INIT_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
        run: &container |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            ca-certificates curl git build-essential file zsync
          init=$RUNNER_TEMP/rustup-init
          curl -fsSL -o "$init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP/$RUSTUP_TARGET/rustup-init"
          echo "$RUSTUP_INIT_SHA256  $init" | sha256sum -c -
          chmod +x "$init"
          "$init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >>"$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The checkout belongs to the runner's user, not the container's root, so git would
      # refuse to read it, and the version with it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo --version
      - run: cargo install --locked cargo-packager --version "$CARGO_PACKAGER"
      - run: cargo install --locked cargo-generate-rpm --version "$CARGO_GENERATE_RPM"
      - run: tools/package.sh --nightly
      # The AppImage under its published name, its `+` a `.` as publish names the other
      # files, extracted and packed again by appimagetool with the update information,
      # which also writes the .zsync beside it, naming that file: AppImageUpdate then
      # fetches only what changed (docs/packaging.md, Nightly builds). The same step in
      # linux-arm, with Arm's files.
      - name: Give the AppImage its update information
        env:
          ARCH: x86_64
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: &zsync |
          tools=$RUNNER_TEMP/appimage
          mkdir -p "$tools"
          curl -fsSL -o "$tools/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL/appimagetool-$ARCH.AppImage"
          curl -fsSL -o "$tools/runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME/runtime-$ARCH"
          sha256sum -c - <<EOF
          $APPIMAGETOOL_SHA256  $tools/appimagetool
          $RUNTIME_SHA256  $tools/runtime
          EOF
          chmod +x "$tools/appimagetool"
          cd target/package/*/out
          built=(*.AppImage)
          if [ "${#built[@]}" -ne 1 ] || [ ! -f "${built[0]}" ]; then
            echo "error: one AppImage expected, found: ${built[*]}" >&2
            exit 1
          fi
          name=$(printf '%s' "${built[0]}" | tr -c 'A-Za-z0-9._-' '.')
          "./${built[0]}" --appimage-extract >/dev/null
          rm -- "${built[0]}"
          "$tools/appimagetool" --appimage-extract-and-run --no-appstream \
            --runtime-file "$tools/runtime" \
            -u "gh-releases-zsync|apertrust|apertrust|nightly|apertrust-nightly-*-linux-$ARCH.AppImage.zsync" \
            squashfs-root "$name"
          rm -rf squashfs-root
          ls -l "$name" "$name.zsync"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: |
            target/package/*/out/*.AppImage
            target/package/*/out/*.AppImage.zsync
            target/package/*/out/*.deb
            target/package/*/out/*.rpm
            target/package/*/out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Linux on Arm's AppImage, .deb, .rpm and tarball, built on Arm in the same container.
  linux-arm:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install the build's tools
        env:
          RUSTUP_TARGET: aarch64-unknown-linux-gnu
          RUSTUP_INIT_SHA256: 9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282
        run: *container
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo --version
      - run: cargo install --locked cargo-packager --version "$CARGO_PACKAGER"
      - run: cargo install --locked cargo-generate-rpm --version "$CARGO_GENERATE_RPM"
      - run: tools/package.sh --nightly
      - name: Give the AppImage its update information
        env:
          ARCH: aarch64
          APPIMAGETOOL_SHA256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          RUNTIME_SHA256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
        run: *zsync
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux-arm
          path: |
            target/package/*/out/*.AppImage
            target/package/*/out/*.AppImage.zsync
            target/package/*/out/*.deb
            target/package/*/out/*.rpm
            target/package/*/out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Only after every build succeeded, and only from main.
  publish:
    needs: [check, macos, windows, windows-arm, linux, linux-arm]
    if: needs.check.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: downloads
          merge-multiple: true
      # The files in one folder (the Mac's come in a folder per chip). GitHub renames an
      # asset whose name holds other characters than letters, digits, `.`, `-` and `_`:
      # the version's `+` becomes `.` here, so that each file is published under the name
      # it was given; the AppImages come named so, as their .zsync files name them.
      - name: Name the files
        run: |
          mkdir dist
          find downloads -type f -exec mv -t dist -- {} +
          cd dist
          for file in *; do
            safe=$(printf '%s' "$file" | tr -c 'A-Za-z0-9._-' '.')
            [ "$safe" = "$file" ] || mv -- "$file" "$safe"
          done
          ls -l
      # Each file's SHA-256, in sha256sum's format, published beside them.
      - name: List the checksums
        working-directory: dist
        run: |
          sha256sum -- * >../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      # The release is made again, its tag with it, through the Releases API: GitHub
      # refuses the job's token a `git push` of a tag whose commit changes workflow files.
      - name: Replace the nightly release
        run: |
          date=$(date -u +%Y-%m-%d)
          cat >notes.md <<EOF
          Apertrust Nightly, built from [\`${SHA:0:7}\`](https://github.com/$GH_REPO/commit/$SHA) on main on $date.

          Nightly builds are untested development builds, made each night main changes. Apertrust Nightly installs beside Apertrust, with its own name and settings, but it reads and writes the same edits beside your photos.

          How to install each package, and open it unsigned: [Installation](https://github.com/$GH_REPO#installation).
          EOF
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* --target "$SHA" --title "Nightly build $date" \
            --notes-file notes.md --prerelease --latest=false
          # Every file under the name it was given.
          now=$(gh release view nightly --json assets --jq '.assets[].name' | sort)
          given=$(cd dist && printf '%s\n' * | sort)
          if [ "$now" != "$given" ]; then
            printf 'the release holds:\n%s\nnot:\n%s\n' "$now" "$given" >&2
            gh release delete nightly --yes --cleanup-tag
            exit 1
          fi
