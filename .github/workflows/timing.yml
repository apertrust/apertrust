name: Timing

# The pipeline timed on the software GPUs, lavapipe and WARP (decision 7), as
# docs/engine.md's Testing asks: a 61 MP export, tiled as the adapter needs, and
# exposure changes at viewport size. Run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  timing:
    name: timing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # A release build, three 61 MP exports and ten changes, WARP the slowest.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the Sony 7R V sample, 61 MP
        run: |
          name="Sony/ILCE-7RM5/7RM5-LosslessCompressedLarge.ARW"
          digest=$(grep -F "  $name" crates/raw/tests/corpus/files.sha256 | cut -d' ' -f1)
          test -n "$digest"
          curl --proto '=https' -fsSL --globoff -o sample.arw "https://raw.pixls.us/data/${name// /%20}"
          echo "$digest  sample.arw" | sha256sum -c -
      - run: cargo build --locked --release -p apertrust-cli
      - run: cargo run --locked --release -p apertrust-cli -- gpu
      # Three exports, each tiled as it needs. Each run is a new process, so each one
      # compiles the kernels again. `--runs 1` renders directly, outside the session's
      # export job, whose renders are untimed, as before the job: the same renders, timed.
      # A tiled export's `exported N tiles in` time includes compiling and reading each
      # tile back; its `rendering:` and `GPU:` add up the renders alone, the raw stage's
      # and the tiles'. An untiled export's `rendered … in` line is already the render
      # alone.
      - name: Export
        run: |
          for _ in 1 2 3; do
            cargo run --locked --release -p apertrust-cli -- -d perf --conf export.disk.on_conflict=overwrite export sample.arw -o sample.png --runs 1
          done
      # The viewport pipe demosaics and downscales in tiles where the GPU binds less
      # than demosaic's 963 MB image at once, as lavapipe's 128 MiB does, and whole where
      # it binds it, as WARP does (decision 14); the first render's line says which.
      - name: Exposure changes at viewport size
        run: cargo run --locked --release -p apertrust-cli -- preview sample.arw --changes 10
