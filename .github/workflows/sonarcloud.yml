name: SonarQube Cloud

# Prepared before the project is linked to SonarQube Cloud: it does nothing until the
# SONAR_TOKEN secret exists. Coverage comes from the tests on Linux (lavapipe).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  sonar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The token reaches only the two steps that need it, never the build or the tests.
    steps:
      # Secrets are not passed to pull requests from forks, so the job skips there too.
      - name: Check for the token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space
        if: steps.token.outputs.present == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install lavapipe
        if: steps.token.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.token.outputs.present == 'true'
      - name: Install cargo-llvm-cov
        if: steps.token.outputs.present == 'true'
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - name: Add llvm-tools
        if: steps.token.outputs.present == 'true'
        run: rustup component add llvm-tools-preview
      - name: Coverage
        if: steps.token.outputs.present == 'true'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Clippy report
        if: steps.token.outputs.present == 'true'
        # Not -D warnings: the report is for SonarQube Cloud, the lint job gates warnings.
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json
      - name: Scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
