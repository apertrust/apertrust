name: CI

# Three layers (decision 70). Every pull request and push to main: pre-commit's checks
# (.pre-commit-config.yaml, CONTRIBUTING.md's Checks), which take in the formatting, the
# repository's checks, cargo-deny and clippy for Linux, Windows and macOS, and the tests
# on Linux and macOS. nightly-tests.yml runs the tests on Linux and macOS every night, and
# a pull request labelled `full-ci` runs everything even when it changes only docs.
# Windows' tests are off for now: on WARP they ran past two hours. A pull request that
# changes only the documentation in .github/docs-only-paths.txt skips pre-commit's long
# checks and the tests: they report as skipped, so the workflow still ends.
on:
  push:
    branches: [main]
  # Not on `labeled`: a run that a label started would cancel the one in progress. To use
  # `full-ci`, add the label and re-run the jobs; the platforms job reads the labels then.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a pull request cancels its run in progress; main's runs all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every check of .pre-commit-config.yaml, on every file: the quick ones always, the long
  # ones, clippy for Linux, Windows and macOS (tools/clippy.sh --all) and the API docs,
  # when the code's checks run. Clippy compiles Windows' and macOS's code and tests here,
  # never linking, so they need no runner of their own.
  pre-commit:
    name: pre-commit
    needs: platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRE_COMMIT_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The hooks' tools, cargo-deny built from source among them, as the config pins them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx install pre-commit==4.7.0
      # Every check, the manual stage's too, as CONTRIBUTING.md's command runs them; a
      # change to documentation alone skips the long ones. rustup installs the toolchain
      # pinned in rust-toolchain.toml on first use.
      - name: Checks
        env:
          SKIP: ${{ needs.platforms.outputs.code != 'true' && 'clippy,api-docs' || '' }}
        run: pre-commit run --hook-stage manual --all-files --show-diff-on-failure
      # The disk left, failed or not: clippy's three builds and the caches take under
      # 10 GB, on a runner that has had far more free, so nothing is cleared first.
      - name: Disk space
        if: always()
        run: df -h /

  # Whether the code's checks run, and the runners the tests run on. The checks run on
  # main, and for a pull request that changes a file outside .github/docs-only-paths.txt
  # or is labelled `full-ci`. The tests run on Linux and macOS. Windows' tests are off for
  # now; .github/windows-paths.txt and its guard stay, for when they run again.
  platforms:
    name: Choose what runs
    runs-on: ubuntu-24.04
    # It alone reads the pull request's labels. A job's permissions replace the workflow's,
    # so `contents` is repeated.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    outputs:
      code: ${{ steps.platforms.outputs.code }}
      os: ${{ steps.platforms.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: platforms
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The labels as they are now, not as the event saw them, so a re-run after adding
          # `full-ci` picks it up.
          code=true
          if [ "$EVENT" = pull_request ]; then
            labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
            if ! grep -qx full-ci <<< "$labels"; then
              paths=$(tools/check-docs-paths.sh --code "$BASE...$HEAD")
              if [ -z "$paths" ]; then
                echo "Documentation only: pre-commit's long checks and the tests are skipped."
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo 'os=["ubuntu-24.04", "macos-15"]' >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: platforms
    if: needs.platforms.outputs.code == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      os: ${{ needs.platforms.outputs.os }}

  # The one check of this workflow a ruleset requires: it passes when every job above
  # passed or was skipped, as on a pull request that changes only docs.
  ci-passed:
    needs: [platforms, pre-commit, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key) \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while read -r job result; do
              echo "::error::$job: $result"
            done <<< "$failed"
            exit 1
          fi
