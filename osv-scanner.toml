# OSV-Scanner's configuration, which OpenSSF Scorecard's Vulnerabilities check reads.
# These advisories are ignored in deny.toml too, for the same reason: keep the two in step.

# zbus's name and value types, merged into zbus 6 and no longer published apart; not
# vulnerabilities. They come with egui's Linux screen-reader bridge (accesskit_unix, atspi,
# zbus 5), which has no zbus 6 release yet. Remove these when AccessKit moves to zbus 6.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "zvariant merged into zbus 6; AccessKit's Linux bridge is still on zbus 5"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "zbus_names merged into zbus 6; AccessKit's Linux bridge is still on zbus 5"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
reason = "zvariant_derive merged into zbus 6; AccessKit's Linux bridge is still on zbus 5"

# chrono is unmaintained, not vulnerable. rawler uses it for its metadata's dates. Remove
# this when no crate in the tree needs chrono.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "chrono unmaintained, not a vulnerability; rawler still depends on it"
