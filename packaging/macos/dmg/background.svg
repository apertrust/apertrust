<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="660" height="400" viewBox="0 0 660 400">
<title>Apertrust disk image</title>
<!--
  The background of the disk image's window, what Finder shows when the .dmg is mounted
  (docs/packaging.md). tools/build-dmg-background.sh renders it at 1x and 2x into
  background.tiff, which the image holds as .background/background.tiff.

  The window's content area is 660 x 400 points; Finder's title bar is above it.
  The layout that pairs with it, in layout.DS_Store (generate.py): icon view, icon size
  128, text size 13, labels below the icons, and the icons' centres
    Apertrust.app   (170, 196)
    Applications    (490, 196)
  so their boxes are x 106-234 and 426-554, y 132-260; nothing is drawn inside them.

  Finder draws the labels in black over a background picture, in dark mode too, so each
  label sits on a light plate: the dark theme's text_secondary, #A0A0A0, 8:1 for black.
  The plates are as wide as the icons, y 266-292, where Finder's labels of 13 points sit
  centred (checked in Finder on macOS 27).
  The ground is its surface, the arrow its text_secondary in a 1.25-point line, as Lucide
  draws arrow-right (crates/ui/themes/dark.toml). The logo is the dark one, linked.

  The caption, "Drag Apertrust to Applications", is IBM Plex Sans Regular at 13 points,
  centred at x 330 on the baseline y 352, in text_secondary, outlined to a path so that
  rendering it needs no fonts. To change the words, set them as text, outline them with
  usvg (resvg's text feature) and replace the path.
-->
<rect width="660" height="400" fill="#2D2D2D"/>
<image xlink:href="../../../crates/app/assets/icons/svg/apertrust-logo-dark.svg" x="261.83" y="40" width="136.34" height="32"/>
<g fill="none" stroke="#A0A0A0" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
<path d="M260 196H400"/>
<path d="M394 190L400 196L394 202"/>
</g>
