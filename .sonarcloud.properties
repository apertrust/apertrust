# SonarQube Cloud's automatic analysis, which checks every pull request and push to main.
# The sources it reads, without the generated WGSL.
sonar.sources=crates
sonar.exclusions=**/generated/**,**/*.wgsl,target/**
# Reference tables a test holds code to, a row per tool, repeat by nature: not
# duplicated code.
sonar.cpd.exclusions=crates/tools/tests/about.rs
