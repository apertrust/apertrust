# The Essentials workspace, built in (decision 96): Photos, Adjust with the tools most
# edits need, then History, Scopes pinned over Adjust. Every other tool is in no tab, so
# hidden: a workspace decides only what is shown, and a hidden tool is still processed.
# The app embeds this file and reads it as it reads a person's own
# (crates/app/src/layout.rs). A person's changed copy is
# <user data>/workspaces/essentials.toml, in the same format.
#
# A built-in tab names no title: its title is the message tab-<id>, so its words follow
# the language. Nor does the file name the workspace: its name is the message
# workspace-essentials, translated; a person's own file names itself with name. Bundled,
# it lists no seen: its lists are its defaults, and a new build's tool its lists leave out
# is hidden too.

version = 1
hidden = []

# The Toolbar's items in order (decision 92): the default list. The Mac never draws the menu
# button, and keeps it in the list.
toolbar = [
    "menu-button",
    "import",
    "export",
    "reset",
    "undo",
    "redo",
    "flexible-space",
    "cursors",
    "flexible-space",
    "guides",
    "space",
    "copy-edit",
    "apply-edit",
    "jobs",
    "save-state",
]

[[tabs]]
id = "photos"
icon = "folder"

[[tabs]]
id = "adjust"
icon = "adjust"

[[tabs]]
id = "history"
icon = "history"

[pinned]
adjust = ["scopes"]

[order]
photos = ["collections", "export"]
adjust = [
    "temperature",
    "exposure",
    "agx",
    "toneequal",
    "colorbalancergb",
    "flip",
]
history = ["history"]
