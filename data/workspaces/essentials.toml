# The Essentials workspace, built in (decision 96): Photos, Adjust with the tools most
# edits need, then History, Collections pinned over Photos and Scopes over Adjust. Every
# other tool is in no tab, so hidden: a workspace decides only what is shown, and a hidden
# tool is still processed.
# The app embeds this file and reads it as it reads a person's own
# (crates/app/src/layout.rs). A person's changed copy is
# <user data>/workspaces/essentials.toml, in the same format.
#
# A built-in tab names no title: its title is the message tab-<id>, so its words follow
# the language. Nor does the file name the workspace: its name is the message
# workspace-essentials, translated; a person's own file names itself with name. Bundled,
# it lists no seen: its lists are its defaults, and a new build's tool its lists leave out
# is hidden too.

version = 1
hidden = []

# The Toolbar's items in order (decision 92): the default list. The menu button is no item:
# on Windows and Linux it stands first whatever the list holds.
toolbar = [
    "import",
    "export",
    "reset",
    "undo",
    "redo",
    "flexible-space",
    "cursors",
    "jobs",
    "save-state",
    "flexible-space",
    "guides",
    "space",
    "copy-edit",
    "apply-edit",
]

[[tabs]]
id = "photos"
icon = "folder"

[[tabs]]
id = "adjust"
icon = "adjust"

[[tabs]]
id = "history"
icon = "history"

# Collections is pinned, and kept first in Photos' order too, where it shows pinned, as
# Default keeps it.
[pinned]
photos = ["collections"]
adjust = ["scopes"]

[order]
photos = ["collections", "export"]
adjust = [
    "temperature",
    "exposure",
    "agx",
    "toneequal",
    "colorbalancergb",
    "flip",
]
history = ["history"]
