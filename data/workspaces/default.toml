# The Default workspace, built in (decisions 38 and 96): Photos, the tools by editing
# stage, then History, Scopes pinned over the five editing tabs. The app embeds
# this file and reads it as it reads a person's own (crates/app/src/layout.rs). A person's
# changed copy is <user data>/workspaces/default.toml, in the same format.
#
# A built-in tab names no title: its title is the message tab-<id>, so its words follow
# the language. Nor does the file name the workspace: its name is the message
# workspace-default, translated; a person's own file names itself with name. Bundled, it
# lists no seen: its lists are its defaults.

version = 1
hidden = []

# The Toolbar's items in order (decision 92): the default list. The Mac never draws the menu
# button, and keeps it in the list.
toolbar = [
    "menu-button",
    "import",
    "export",
    "reset",
    "undo",
    "redo",
    "flexible-space",
    "cursors",
    "flexible-space",
    "copy-edit",
    "apply-edit",
    "jobs",
    "save-state",
]

[[tabs]]
id = "photos"
icon = "folder"

[[tabs]]
id = "adjust"
icon = "adjust"

[[tabs]]
id = "detail"
icon = "detail"

[[tabs]]
id = "geometry"
icon = "correct"

[[tabs]]
id = "effects"
icon = "effect"

[[tabs]]
id = "raw"
icon = "raw"

[[tabs]]
id = "history"
icon = "history"

[pinned]
adjust = ["scopes"]
detail = ["scopes"]
geometry = ["scopes"]
effects = ["scopes"]
raw = ["scopes"]

# Each tab's tools top to bottom, in editing order, Raw's in processing order. AgX stands
# for the edit's tone mapper; the Tone curve has RGB curve's place until RGB curve replaces
# it. Detail is drawn disabled until its first tool.
[order]
photos = ["collections", "export"]
adjust = [
    "temperature",
    "channelmixerrgb",
    "exposure",
    "agx",
    "toneequal",
    "hazeremoval",
    "tone_curve",
    "colorbalancergb",
    "primaries",
]
detail = []
geometry = ["flip"]
effects = ["vignette", "grain", "soften"]
raw = ["rawprepare", "highlights", "demosaic", "colorin", "colorout"]
history = ["history"]
